<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#04150F">
<title>AROGYATI</title>
<link rel="preload" href="assets/fonts/Jakarta.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/deck.css">
</head>
<body class="intro">
<div id="bgfx"></div>
<div id="stage">
  <div id="blob" class="morph"><div class="paper"></div></div>
  <div id="blob2" class="morph"></div>
  <div id="photo" class="morph"><img alt=""><img alt=""><div class="shade"></div><div class="grain"></div></div>
  <div id="slides"></div>
  <div class="wm"><svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="1.6" opacity=".35"/><path d="M6 21h6l3-8 5 15 4-12 2 5h8" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>AROGYATI</div>
  <div class="pg"><b id="pgc">01</b> / <span id="pgt">00</span></div>
</div>

<div id="eL" class="edge"></div><div id="eR" class="edge"></div>
<div id="prog"></div>

<div id="ui">
  <button id="bPrev" title="Previous (←)"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <span class="ct"><b id="cur">01</b> / <span id="tot">00</span></span>
  <button id="bNext" title="Next (→ / Space)"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  <span class="sep"></span>
  <button id="bOv" title="All slides (G)"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></button>
  <button id="bSnd" title="Sound effects (S)"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg></button>
  <button id="bMusic" title="Music (M)"><svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2.5"/><circle cx="17" cy="16" r="2.5"/></svg></button>
  <button id="bFs" title="Full screen (F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>

<div id="toast" class="gone">Press <kbd>F</kbd> for full screen · <kbd>←</kbd> <kbd>→</kbd> to move</div>
<div id="ov"><h3>ALL SLIDES</h3><div id="ovg"></div></div>
<audio id="music" src="assets/music.mp3" loop preload="none"></audio>
<script src="assets/deck.js"></script>
</body>
</html>
