<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AROGYATI</title>
<link rel="stylesheet" href="assets/player.css">
</head>
<body>
<div id="stage">
  <video id="v0" playsinline preload="auto"></video>
  <video id="v1" playsinline preload="auto"></video>
</div>

<div id="zoneL" class="zone"></div>
<div id="zoneR" class="zone"></div>

<div id="bar">
  <button id="bPrev" title="Previous  ←"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button id="bPlay" title="Pause / Play  P"><svg viewBox="0 0 24 24" id="icPause"><path d="M8 5v14M16 5v14"/></svg><svg viewBox="0 0 24 24" id="icPlay" style="display:none"><path d="M8 5l11 7-11 7z"/></svg></button>
  <button id="bNext" title="Next  → / Space"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  <div id="scrub"><i id="scrubFill"></i><input id="scrubIn" type="range" min="0" max="1000" value="0"></div>
  <span id="count"><b id="cur">01</b>/ 20</span>
  <span class="sep"></span>
  <button id="bAuto" title="Auto-advance  A"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3M18 3v4h-4M6 21v-4h4"/></svg></button>
  <button id="bMusic" title="Music  M"><svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2.5"/><circle cx="17" cy="16" r="2.5"/></svg></button>
  <button id="bSnd" title="Sound effects  S"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg></button>
  <button id="bOv" title="All slides  O"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></svg></button>
  <button id="bFs" title="Fullscreen  F"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>

<div id="ov"><div id="ovg"></div></div>

<div id="start">
  <div class="mark">
    <svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="18" stroke="#0E7A5A" stroke-width="1.6" opacity=".35"/><path d="M6 21h6l3-8 5 15 4-12 2 5h8" stroke="#0E7A5A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="20" r="18" stroke="#C28A2C" stroke-width="2.2" stroke-dasharray="26 90" stroke-linecap="round"/></svg>
    <h1>AROGYATI</h1>
    <button id="go" aria-label="Play"><svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg></button>
  </div>
</div>

<audio id="music" src="assets/music.mp3" loop preload="auto"></audio>
<script src="assets/player.js"></script>
</body>
</html>
